# Tooling configuration only; Polarum itself has no dependencies and is not
# built as a package (it is installed with install.sh).

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",  # long lines are tolerated; formatting is not enforced
    "S101",  # assert is used in tests
    "S404",  # subprocess is the point of this tool
    "S603",  # arguments are lists built from validated config, never shell=True
    "S607",  # ssh / ssh-add are intentionally resolved through PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]

[tool.bandit]
# B404/B603/B607: subprocess with fixed argument lists and validated inputs.
skips = ["B404", "B603", "B607"]
exclude_dirs = ["tests"]
